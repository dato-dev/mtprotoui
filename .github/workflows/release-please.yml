name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build and push images to Docker Hub only when a release was just created.
  docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            dato1/mtprotouiapi:${{ needs.release-please.outputs.tag_name }}
            dato1/mtprotouiapi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./caddy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            dato1/mtprotouicaddy:${{ needs.release-please.outputs.tag_name }}
            dato1/mtprotouicaddy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
